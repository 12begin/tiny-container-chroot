# 小小容器（Chroot）容器配置文件
# 基于 tmoe 版配置改写，适配 chroot 模式

# 代号必须是合法文件名，容器会被放到以该值命名的文件夹
code: "xfce"
name: "Debian 13 XFCE"
description: "最经典的容器，包含 Windows 风格主题和开箱即用的火狐浏览器、中文输入法。"
# 图片预览。只能是图片地址。
preview: "/home/tiny/.local/share/backgrounds/Fluent-building-day.png"
# 介绍你的容器的网页。可以缺失。
webpage: "https://www.github.com/Cateners/tiny_computer"

# 小小容器提供若干功能，可以按需使用。
feature:
  # audio类型
  - type: "audio"
    name: "音频播放"
    description: "开启后，将持续获取容器内音频并播放。下次启动容器时生效。"
    enabled: true

  # microphone类型
  - type: "microphone"
    name: "麦克风转发"
    description: "启动麦克风，将音频实时转发到容器。麦克风持续开启会比较耗电，记得关闭！"

  # avnc类型（VNC 图形界面）
  - type: "avnc"
    name: "AVNC显示图形界面"
    description: |
      默认情况下会模拟触摸板方式操控，长按是鼠标右键，双指单击弹出软键盘。
      可搭配键鼠使用，免除触摸模拟延迟。
      中文输入会自动通过 Shift+Insert(粘贴) 发送。在终端，粘贴的快捷键通常是 Ctrl+Shift+Insert，所以输入中文时需要按住 Ctrl。
      如果遇到不能输入的情况，可以使用 Ctrl+<空格> 使用容器内输入法！
    command: |
      sudo service dbus start; \
      eval `dbus-launch --sh-syntax`; \
      export XDG_RUNTIME_DIR="/tmp/runtime-tiny"; \
      mkdir -p $XDG_RUNTIME_DIR; \
      rm -f /tmp/.X1-lock /tmp/.X11-unix/X1 2>/dev/null; \
      fuser -k 5901/tcp 2>/dev/null; \
      mkdir -p /tmp/.X11-unix 2>/dev/null; \
      touch /tmp/.tiny.vnc 2>/dev/null && rm -f /tmp/.tiny.vnc; \
      Xtigervnc -geometry 1440x720 -ZlibLevel=0 -pn -rfbport 5901 \
      -SendPrimary=off -SetPrimary=off -FrameRate=120 -rfbunixpath /tmp/.tiny.vnc -alwaysshared -depth 24 \
      -SecurityTypes None -desktop "Debian 13 XFCE" :1 -extension MIT-SHM > /tmp/vnc.log 2>&1 & \
      while [ ! -S "/tmp/.tiny.vnc" ]; do sleep 0.1; done && \
      su - tiny -c "DISPLAY=:1 startxfce4" > /dev/null 2>&1 &
    link: "vnc://127.0.0.1:5901"
    enabled: true
    adapt_to_screen_size: true
    scale_ratio: 0

  # x11类型（Termux:X11 图形界面）
  - type: "x11"
    args: [":1", "-extension", "MIT-SHM"]
    name: "Termux:X11显示图形界面"
    description: |
      支持手写笔操控。目前上限最高的图形界面显示方式，但也最吃性能。
      需要"通知"权限。如果没有，可能在进入界面时卡住。
      默认情况下以触摸板方式操控，双指单击是鼠标右键，返回弹出小键盘。
    command: 'mkdir -p "$HOME/.vnc" && bash /etc/X11/xinit/Xsession &> "$HOME/.vnc/x.log" &'
    enabled: false

# chroot 启动命令
chroot_boot_command: |
  /bin/bash --login

# 导出命令（chroot 版）
export_command: |
  rm -f /tmp/.tiny.vnc /tmp/.X1-lock 2>/dev/null; \
  apt clean && apt autoclean && apt autoremove --purge -y; \
  rm -rf /tmp/* /var/tmp/* 2>/dev/null; \
  rm -rf /root/.cache/* /home/tiny/.cache/* 2>/dev/null; \
  rm -f /root/.bash_history /home/tiny/.bash_history 2>/dev/null; \
  tar --zstd -cpvf /公共/rootfs.tar.zst \
    --exclude='proc/*' --exclude='sys/*' --exclude='dev/*' --exclude='tmp/*' \
    --exclude='var/cache/apt/*' --exclude='var/log/*' --exclude='root/.cache/*' \
    --exclude='home/tiny/.cache/*' \
    --exclude='root/.bash_history' --exclude='home/tiny/.bash_history' \
    --exclude='mnt/*' \
    .tiny.yaml bin boot etc home lib media opt root sbin srv usr var

# 快捷命令
quick_commands:
  - type: "command"
    name: 检查软件包更新并升级
    description: 一次性进行修复、更新、升级、清理软件包操作。不是更新小小容器软件本身！
    command: >
      sudo dpkg --configure -a && sudo apt update &&
      sudo -E env DEBIAN_FRONTEND=noninteractive apt -y
      -o Dpkg::Options::="--force-confdef"
      -o Dpkg::Options::="--force-confold" full-upgrade &&
      sudo apt autoremove -y

  - type: "command"
    name: 查看系统信息
    description: 使用 fastfetch 查看系统信息
    command: fastfetch --structure meow && fastfetch --logo none

  - type: "command"
    name: 清屏
    command: clear

  - type: "command"
    name: 中断
    description: 向当前会话发送 Ctrl + C
    command: "\x03"

  - type: "command"
    name: 清理包管理器缓存
    command: sudo apt clean

  - type: "commands"
    name: 软件管理
    description: 在这里安装或卸载少数几个软件。想要更多还得自行熟悉 Linux 系统操作...
    commands:
      - type: "commands"
        name: 图形处理软件 Krita
        description: 虽然其实是绘画软件！
        commands:
          - type: "command"
            name: 安装
            command: >
              sudo apt update &&
              sudo -E env DEBIAN_FRONTEND=noninteractive apt -y
              -o Dpkg::Options::="--force-confdef"
              -o Dpkg::Options::="--force-confold"
              install krita krita-l10n
          - type: "command"
            name: 卸载
            command: sudo apt autoremove --purge -y krita krita-l10n

      - type: "commands"
        name: 科学计算软件 Octave
        description: 一定程度上可以作为 Matlab 的平替。
        commands:
          - type: "command"
            name: 安装
            command: >
              sudo apt update &&
              sudo -E env DEBIAN_FRONTEND=noninteractive apt -y
              -o Dpkg::Options::="--force-confdef"
              -o Dpkg::Options::="--force-confold"
              install octave
          - type: "command"
            name: 卸载
            command: sudo apt autoremove --purge -y octave

# 选项
options:
  - type: "option"
    name: 高分辨率支持
    description: 一键开启高清模式，显示更清晰的同时速度会变慢。
    env: ["GDK_SCALE=2", "QT_FONT_DPI=192"]
    enabled: false

  - type: "options"
    name: 图形加速
    description: >
      使用图形加速可部分利用设备GPU提升系统图形处理表现，
      但由于设备差异也可能导致容器系统及软件运行不稳定甚至异常退出。
    options:
      - type: "option"
        name: Virgl 加速
        description: 使用 Virgl 为使用 OpenGL ES 的应用提供加速。
        env: ["GALLIUM_DRIVER=virpipe"]
        pre_start_host_command: >
          /system/bin/su -c "pkill virgl_test_server 2>/dev/null;
          $BIN_DIR/virgl_test_server --use-egl-surfaceless --use-gles
          --socket-path=$CACHE_DIR/tmp/.virgl_test &"
        post_end_host_command: /system/bin/su -c "pkill virgl_test_server"
        enabled: false
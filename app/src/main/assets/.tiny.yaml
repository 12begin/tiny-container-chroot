- type: avnc
  name: AVNC显示图形界面
  description: |-
    默认情况下会模拟触摸板方式操控，长按是鼠标右键，双指单击弹出软键盘。
    可搭配键鼠使用，免除触摸模拟延迟。
    中文输入会自动通过 Shift+Insert(粘贴) 发送。在终端，粘贴的快捷键通常是 Ctrl+Shift+Insert，所以输入中文时需要按住 Ctrl。
    如果遇到不能输入的情况，可以使用 Ctrl+<空格> 使用容器内输入法！
  command: |
    sudo service dbus start; \
    eval `dbus-launch --sh-syntax`; \
    export XDG_RUNTIME_DIR="/tmp/runtime-tiny"; \
    mkdir -p $XDG_RUNTIME_DIR; \
    Xtigervnc -geometry 1440x720 -ZlibLevel=0 -pn -rfbport 5900 \
    -SendPrimary=off -SetPrimary=off -FrameRate=120 -rfbunixpath /tmp/.tiny.vnc -alwaysshared -once -depth 24 \
    -rfbauth /root/.vnc/passwd -desktop "Debian-GNU/Linux-13-(trixie)_pd-tiny-linux-vnc" :0 -extension MIT-SHM > /dev/null 2>&1 & \
    while [ ! -S "/tmp/.tiny.vnc" ]; do sleep 0.1; done && \
    startxfce4 > /dev/null 2>&1 &
    while [ ! -S "/tmp/.tiny.vnc" ]; do sleep 0.1; done && \
    startxfce4 > /dev/null 2>&1 &
  link: vnc://127.0.0.1:5900
  enabled: true
  adapt_to_screen_size: true
  scale_ratio: -0.5
- type: x11
  args: [':0', -extension, MIT-SHM]
  name: Termux:X11显示图形界面
  description: |-
    支持手写笔。目前上限最高的图形界面显示方式，但也较吃性能。
    需要"通知"权限。如果没有，可能在进入界面时卡住。
    默认情况下以触摸板方式操控，双指单击是鼠标右键，返回弹出小键盘。
  command: |
    sudo service dbus start; \
    eval `dbus-launch --sh-syntax`; \
    export XDG_RUNTIME_DIR="/tmp/runtime-tiny"; \
    mkdir -p $XDG_RUNTIME_DIR; \
    startxfce4 > /dev/null 2>&1 &
  enabled: false
# chroot 模式下的启动命令
# 当应用以 root 权限运行时，使用 chroot 代替 proot 启动容器。
# 直接启动 bash，环境变量由 chroot 前的 env 设置
chroot_boot_command: |
  /bin/bash --login
export_command: |
  $BIN_DIR/proot -H --kill-on-exit --link2symlink --sysvipc --kernel-release="Linux localhost 6.17.0-PRoot-Distro #1 SMP PREEMPT_DYNAMIC Fri, 10 Oct 2025 00:00:00 +0000 aarch64 localdomain -1" -L --rootfs=$CONTAINER_DIR --cwd=/root --bind=/data --bind=/dev --bind=/proc --bind=/sys --bind=/dev/urandom:/dev/random --bind=/proc/self/fd:/dev/fd --bind=/proc/self/fd/0:/dev/stdin --bind=/proc/self/fd/1:/dev/stdout --bind=/proc/self/fd/2:/dev/stderr --bind=$CONTAINER_DIR/sys/.empty:/sys/fs/selinux --bind=$CONTAINER_DIR/proc/.loadavg:/proc/loadavg --bind=$CONTAINER_DIR/proc/.stat:/proc/stat --bind=$CONTAINER_DIR/proc/.uptime:/proc/uptime --bind=$CONTAINER_DIR/proc/.version:/proc/version --bind=$CONTAINER_DIR/proc/.vmstat:/proc/vmstat --bind=$CONTAINER_DIR/proc/.sysctl_entry_cap_last_cap:/proc/sys/kernel/cap_last_cap --bind=$CONTAINER_DIR/proc/.sysctl_inotify_max_user_watches:/proc/sys/fs/inotify/max_user_watches --bind=$CACHE_DIR/tmp:/dev/shm --bind=$CACHE_DIR/tmp:/tmp --bind=$CACHE_DIR/run:/run --mount=$PUBLIC_DIR:/公共 /usr/bin/env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin LANG=zh_CN.UTF-8 TERM=xterm-256color COLORTERM=truecolor /bin/bash /opt/tiny/export.sh
quick_commands:
- type: command
  name: 检查软件包更新并升级
  description: 一次性进行修复、更新、升级、清理软件包操作。不是更新小小容器软件本身！
  command: |
    sudo dpkg --configure -a && sudo apt update && sudo -E env DEBIAN_FRONTEND=noninteractive apt -y -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" full-upgrade && sudo apt autoremove -y
- {type: command, name: 查看系统信息, description: 使用 fastfetch 查看系统信息, command: fastfetch
    --structure meow && fastfetch --logo none}
- {type: command, name: 清屏, command: clear}
- type: command
  name: 中断
  description: 向当前会话发送 Ctrl + C
  command: !!binary |-
    Aw==
- {type: command, name: 清理包管理器缓存, command: sudo apt clean}
- type: commands
  commands:
  - type: commands
    name: 办公软件 OnlyOffice
    description: |
      如果你不执着于使用 WPS，那么 OnlyOffice 是个不错的替代。
      OnlyOffice 有安卓版本
    commands:
    - type: command
      name: 安装
      command: |
        wget https://download.onlyoffice.com/install/desktop/editors/linux/onlyoffice-desktopeditors_arm64.deb -O /tmp/office.deb && sudo apt update && sudo -E env DEBIAN_FRONTEND=noninteractive apt -y -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" install patchelf /tmp/office.deb; patchelf --clear-execstack /opt/onlyoffice/desktopeditors/libQt5Gui.so.5; rm /tmp/office.deb
    - {type: command, name: 卸载, command: sudo apt autoremove --purge -y onlyoffice-desktopeditors}
  - type: commands
    name: 图形处理软件 Krita
    description: |
      虽然其实是绘画软件！
      强烈建议关闭 Krita 软件内的图形加速，这样会流畅很多，搭配 Termux:X11 完全可以画画。
      Krita 有安卓版本
    commands:
    - type: command
      name: 安装
      command: |
        sudo apt update && sudo -E env DEBIAN_FRONTEND=noninteractive apt -y -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" install krita krita-l10n
    - {type: command, name: 卸载, command: sudo apt autoremove --purge -y krita krita-l10n}
  - type: commands
    name: 科学计算软件 Octave
    description: 一定程度上可以作为 Matlab 的平替。
    commands:
    - type: command
      name: 安装
      command: |
        sudo apt update && sudo -E env DEBIAN_FRONTEND=noninteractive apt -y -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" install octave
    - {type: command, name: 卸载, command: sudo apt autoremove --purge -y octave}
  - type: commands
    name: 视频剪辑软件 Kdenlive
    commands:
    - type: command
      name: 安装
      command: |
        sudo apt update && sudo -E env DEBIAN_FRONTEND=noninteractive apt -y -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" install kdenlive
    - {type: command, name: 卸载, command: sudo apt autoremove --purge -y kdenlive}
  - type: commands
    name: Chromium 浏览器
    description: |
      安装后，通过 Chromium No Sandbox 来打开浏览器。
      目前一个已知问题是 Chromium 无法登录谷歌账号，原因不明。
    commands:
    - type: command
      name: 安装
      command: |
        sudo apt update && sudo -E env DEBIAN_FRONTEND=noninteractive apt -y -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" install chromium chromium-l10n -y && cp /usr/share/applications/chromium.desktop /usr/share/applications/chromium-no-sandbox.desktop && sed -i '/^Name\[.*\]=.*/d; s/^Name=.*/Name=Chromium No Sandbox/' /usr/share/applications/chromium-no-sandbox.desktop && sed -i 's#Exec=/usr/bin/chromium %U#Exec=/usr/bin/chromium --no-sandbox %U#g' /usr/share/applications/chromium-no-sandbox.desktop
    - {type: command, name: 卸载, command: sudo apt autoremove --purge -y chromium chromium-l10n
        && rm /usr/share/applications/chromium-no-sandbox.desktop}
  - type: commands
    name: Visual Studio Code
    description: 安装后，通过 Code No Sandbox 来打开 VS Code 。
    commands:
    - type: command
      name: 安装
      command: |
        curl -L -o /tmp/vscode.deb 'https://aka.ms/linux-arm64-deb' && sudo apt update && sudo -E env DEBIAN_FRONTEND=noninteractive apt -y -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" install /tmp/vscode.deb && cp /usr/share/applications/code.desktop /usr/share/applications/code-no-sandbox.desktop && sed -i '/^Name$$.*$$=.*/d; s/^Name=.*/Name=Code No Sandbox/' /usr/share/applications/code-no-sandbox.desktop && sed -i 's#Exec=/usr/share/code/code %F#Exec=/usr/share/code/code --no-sandbox %F#g' /usr/share/applications/code-no-sandbox.desktop; rm /tmp/vscode.deb
    - {type: command, name: 卸载, command: sudo apt autoremove --purge -y code && sudo
        rm -f /usr/share/applications/code-no-sandbox.desktop}
  - type: commands
    commands:
    - type: command
      name: 安装
      command: |
        wget $(curl -s https://gitee.com/api/v5/repos/spark-store-project/spark-store/releases/latest | grep -o '"browser_download_url":[^}]*arm64\.deb[^}]*' | sed 's/.*"browser_download_url":"\([^"]*\)".*/\1/') -O /tmp/spark.deb && sudo apt update && sudo -E env DEBIAN_FRONTEND=noninteractive apt -y -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" install /tmp/spark.deb -y; rm /tmp/spark.deb
    - {type: command, name: 卸载, command: sudo apt autoremove --purge -y chromium chromium-l10n
        && rm /usr/share/applications/chromium-no-sandbox.desktop}
    name: 星火应用商店
    description: |-
      注意小小容器的linux环境和正常的linux电脑不同，许多应用不经过修补无法正常使用。所以很容易出现星火应用商店中下载安装的应用无法安装或使用的情况。
      建议只有当你确定某个应用可以使用时再安装它
  - type: commands
    commands:
    - type: commands
      name: PyCharm 2026.1.2
      commands:
      - {type: command, name: 安装, command: bash /opt/tiny/extra/install-jetbrains.sh
          pycharm 2026.1.2}
      - {type: command, name: 卸载, command: sudo apt autoremove --purge -y pycharm}
    - type: commands
      name: CLion 2026.1.3
      commands:
      - {type: command, name: 安装, command: bash /opt/tiny/extra/install-jetbrains.sh
          clion 2026.1.3}
      - {type: command, name: 卸载, command: sudo apt autoremove --purge -y clion}
    - type: commands
      name: GoLand 2026.1.3
      commands:
      - {type: command, name: 安装, command: bash /opt/tiny/extra/install-jetbrains.sh
          goland 2026.1.3}
      - {type: command, name: 卸载, command: sudo apt autoremove --purge -y goland}
    - type: commands
      name: Intellij IDEA 2026.1.3
      commands:
      - {type: command, name: 安装, command: bash /opt/tiny/extra/install-jetbrains.sh
          intellij-idea 2026.1.3}
      - {type: command, name: 卸载, command: sudo apt autoremove --purge -y intellij-idea}
    - type: commands
      name: RustRover 2026.1.3
      commands:
      - {type: command, name: 安装, command: bash /opt/tiny/extra/install-jetbrains.sh
          rustrover 2026.1.3}
      - {type: command, name: 卸载, command: sudo apt autoremove --purge -y rustrover}
    - type: commands
      name: WebStorm 2026.1.3
      commands:
      - {type: command, name: 安装, command: bash /opt/tiny/extra/install-jetbrains.sh
          webstorm 2026.1.3}
      - {type: command, name: 卸载, command: sudo apt autoremove --purge -y webstorm}
    name: JetBrains 系列软件
    description: |-
      就是 PyCharm、Clion、Intellij IDEA 等等那些！
      只要改命令内的名称和版本就可以切换软件和版本。
      所有支持的名称和版本可以下面的链接找到。
      https://github.com/JonasGroeger/jetbrains-ppa/tree/master/deb
      另外，JetBrains IDE 使用时可能比较卡顿。
      *代码尽量放在小小容器内部而不是安卓侧存储空间。这是因为存储空间的文件没有可执行权限，可能影响代码执行。
  - type: commands
    name: 常用国产软件
    description: 安装或卸载常用的国产软件。
    commands:
    - type: commands
      name: WPS Office
      commands:
      - type: command
        name: 安装
        description: 如果安装失败，可以通过星火应用商店安装。
        command: |
          cat << 'EOF' | sh && sudo dpkg --configure -a && sudo apt update && sudo apt install -y /tmp/wps.deb libxslt1.1
          wget https://mirrors.sdu.edu.cn/spark-store/arm64-store/office/wps-office/wps-office_11.1.0.11720-fix4_arm64.deb -O /tmp/wps.deb
          EOF
          rm /tmp/wps.deb
      - {type: command, name: 卸载, command: sudo apt autoremove --purge -y wps-office}
    - type: commands

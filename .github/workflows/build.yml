name: 构建 APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: '构建变体'
        required: true
        default: 'all'
        type: choice
        options: [all, xfce, gxde, clean]
      build_type:
        description: 'APK 类型（debug/release/all）'
        required: true
        default: 'release'
        type: choice
        options: [debug, release, all]

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          case "${{ github.event.inputs.variant }}" in
            all)
              echo 'matrix={"include":[{"rootfs":"xfce-zh","suffix":"xfce-zh"},{"rootfs":"xfce-en","suffix":"xfce-en"},{"rootfs":"gxde-zh","suffix":"gxde-zh"},{"rootfs":"gxde-en","suffix":"gxde-en"},{"rootfs":"none","suffix":"clean"}]}' >> $GITHUB_OUTPUT
              ;;
            xfce)
              echo 'matrix={"include":[{"rootfs":"xfce-zh","suffix":"xfce-zh"},{"rootfs":"xfce-en","suffix":"xfce-en"}]}' >> $GITHUB_OUTPUT
              ;;
            gxde)
              echo 'matrix={"include":[{"rootfs":"gxde-zh","suffix":"gxde-zh"},{"rootfs":"gxde-en","suffix":"gxde-en"}]}' >> $GITHUB_OUTPUT
              ;;
            clean)
              echo 'matrix={"include":[{"rootfs":"none","suffix":"clean"}]}' >> $GITHUB_OUTPUT
              ;;
          esac

  build:
    needs: setup-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
      max-parallel: 1
    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }

      - name: 设置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 下载 jniLibs
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          curl -sL -o jniLibs.zip \
            "https://github.com/Cateners/tiny_container/releases/download/v4.0.0/jniLibs.zip"
          unzip -q jniLibs.zip -d app/src/main/jniLibs/arm64-v8a/
          rm jniLibs.zip

      - name: 下载 rootfs
        if: ${{ matrix.rootfs != 'none' }}
        run: |
          case "${{ matrix.rootfs }}" in
            xfce-zh) FILE="xfce-zh-20260627-001457.tar.zst" ;;
            xfce-en) FILE="xfce-en-20260628-072838.tar.zst" ;;
            gxde-zh) FILE="gxde-zh-20260626-110317.tar.zst" ;;
            gxde-en) FILE="gxde-en-20260626-110344.tar.zst" ;;
          esac
          curl -sL -o app/src/main/assets/rootfs.tar.zst \
            "https://github.com/tiny-computer/images/releases/download/260627/${FILE}"
          ls -lh app/src/main/assets/rootfs.tar.zst

      - name: 解码签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > upload-keystore.jks
          echo "STORE_FILE=${GITHUB_WORKSPACE}/upload-keystore.jks" >> $GITHUB_ENV
          echo "STORE_PASSWORD=$STORE_PASS" >> $GITHUB_ENV
          echo "KEY_ALIAS=$ALIAS" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV

      - name: 构建 APK
        env:
          APK_SUFFIX: ${{ matrix.suffix }}
        run: |
          case "${{ github.event.inputs.build_type }}" in
            debug)   ./gradlew assembleDebug ;;
            release) ./gradlew assembleRelease ;;
            all)     ./gradlew assembleDebug assembleRelease --parallel ;;
          esac
          # 重命名 APK，添加变体名
          for apk in app/build/outputs/apk/release/*.apk; do
            [ -f "$apk" ] || continue
            dir=$(dirname "$apk")
            base=$(basename "$apk")
            mv "$apk" "${dir}/tiny-container-chroot-${APK_SUFFIX}-${base}"
          done
          for apk in app/build/outputs/apk/debug/*.apk; do
            [ -f "$apk" ] || continue
            dir=$(dirname "$apk")
            base=$(basename "$apk")
            mv "$apk" "${dir}/tiny-container-chroot-${APK_SUFFIX}-${base}"
          done

      - name: 上传 Debug APK
        if: github.event.inputs.build_type != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: tiny-container-chroot-${{ matrix.suffix }}-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: 上传 Release APK
        if: github.event.inputs.build_type != 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: tiny-container-chroot-${{ matrix.suffix }}
          path: app/build/outputs/apk/release/*.apk